name: check

# Every push and pull request:
#  - plugin: manifests, skills (limits of claude.ai) and the version, which must rise when the plugin changes,
#    because Claude keeps the installed copy until the version changes;
#  - recipes: the code of the Blender skill is run on the same Blender version as the service, so that what the
#    skill teaches is known to work.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manifests, skills, version
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check.py --base "$BASE"

  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLENDER_VERSION: "5.2.3"
      BLENDER_SERIES: "5.2"
      BLENDER_SHA256: 78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec
    steps:
      - uses: actions/checkout@v4
      - name: Blender (cached)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          mkdir -p ~/blender && tar -xJf blender.tar.xz -C ~/blender --strip-components=1
      - name: Libraries Blender needs without a display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libxext6 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libgomp1 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libdbus-1-3 libegl-mesa0 libgl1-mesa-dri libglx-mesa0
      - name: Run the recipes of the Blender skill
        run: |
          ~/blender/blender -b --factory-startup -noaudio --python scripts/test_recipes.py -- \
            "$RUNNER_TEMP/space" roomve-mcp/skills/roomve-blender/references/recipes.md \
            | grep -E "^(PASS|FAIL|Traceback|  File|[A-Za-z.]+(Error|Warning)|[0-9]+ blocks)|Error:"
          test "${PIPESTATUS[0]}" -eq 0
